<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holographic Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: none;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 10px;
        }

        .video-box img {
            max-width: 100%;
            max-height: 60%;
            width: auto;
            height: auto;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .video-box {
            border: 2px solid #000;
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #f9f9f9;
            text-align: center;
            min-height: 40vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .video-box:hover {
            background-color: #e9e9e9;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .video-box h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .video-box p {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .play-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px auto;
        }

        .play-icon::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 20px solid white;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            margin-left: 4px;
        }

        .fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        #videoContainer {
            width: 90%;
            height: 90%;
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }

        .fullscreen-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #youtubeFrame {
            width: 100%;
            height: 100%;
            display: none;
            border: none;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            z-index: 1001;
        }

        .close-btn:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Holographic Display</h1>
        
        <div class="video-grid">
            <div class="video-box" onclick="playVideo('https://www.youtube.com/watch?v=vtLRykWHw9k')">
                <img src="Adam Q1 Thumbnail.png" alt="Adam Q1 Thumbnail"> 
                <h3>Tell me a joke</h3>
                <p>by Adam</p>
                <div class="play-icon"></div>
            </div>
            
            <div class="video-box" onclick="playVideo('https://www.youtube.com/watch?v=0oxR7v85b-o')">
                <img src="Adam Q2 Thumbnail.png" alt="Adam Q2 Thumbnail"> 
                <h3>Teach me a Gen Z word</h3>
                <p>by Adam</p>
                <div class="play-icon"></div>
            </div>
            
            <div class="video-box" onclick="playVideo('https://www.youtube.com/watch?v=lBdzglE0sWQ')">
                <img src="Adam Q3 Thumbnail.png" alt="Adam Q3 Thumbnail"> 
                <h3>Share a hidden talent</h3>
                <p>by Adam</p>
                <div class="play-icon"></div>
            </div>
            
            <div class="video-box" onclick="playVideo('https://www.youtube.com/watch?v=YIoz97Oi_L0')">
                <img src="Liz Q1 Thumbnail.png" alt="Liz Q1 Thumbnail"> 
                <h3>Tell me a joke</h3>
                <p>by Liz</p>
                <div class="play-icon"></div>
            </div>
            
            <div class="video-box" onclick="playVideo('https://www.youtube.com/watch?v=0t5bF8OIMxE')">
                <img src="Liz Q2 Thumbnail.png" alt="Liz Q2 Thumbnail"> 
                <h3>Teach me a Gen Z word</h3>
                <p>by Liz</p>
                <div class="play-icon"></div>
            </div>
            
            <div class="video-box" onclick="playVideo('Liz Q3.mov')">
                <img src="Liz Q3 Thumbnail.png" alt="https://www.youtube.com/watch?v=sx6XH9rmO28"> 
                <h3>Share a hidden talent</h3>
                <p>by Liz</p>
                <div class="play-icon"></div>
            </div>
        </div>
    </div>

    <!-- Fullscreen video overlay -->
    <div class="fullscreen-overlay" id="fullscreenOverlay">
        <span class="close-btn" onclick="closeFullscreen()">&times;</span>
        <div id="videoContainer">
            <video class="fullscreen-video" id="fullscreenVideo" controls></video>
            <iframe id="youtubeFrame" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        function playVideo(videoSrc) {
            const overlay = document.getElementById('fullscreenOverlay');
            const video = document.getElementById('fullscreenVideo');
            const iframe = document.getElementById('youtubeFrame');

            // Trim whitespace from URL
            videoSrc = videoSrc.trim();

            // Reset both players
            video.style.display = 'none';
            iframe.style.display = 'none';
            video.src = '';
            iframe.src = '';

            // Check if YouTube link
            if (videoSrc.includes('youtube.com') || videoSrc.includes('youtu.be')) {
                let videoId = '';

                if (videoSrc.includes('youtu.be/')) {
                    videoId = videoSrc.split('youtu.be/')[1].split(/[?&]/)[0];
                } else if (videoSrc.includes('v=')) {
                    videoId = videoSrc.split('v=')[1].split(/[?&]/)[0];
                }

                if (!videoId) {
                    alert('Invalid YouTube URL');
                    return;
                }

                // Load YouTube embed
                iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
                iframe.style.display = 'block';
            } else {
                // Load local video
                video.src = videoSrc;
                video.style.display = 'block';

                // Attempt playback
                video.play().catch(error => {
                    console.error('Playback failed:', error);
                    alert('Failed to play video: ' + videoSrc);
                    closeFullscreen();
                    return;
                });
            }

            // Show overlay
            overlay.style.display = 'flex';

            // Request fullscreen on next animation frame (to ensure element is rendered)
            requestAnimationFrame(() => {
                if (overlay.requestFullscreen) {
                    overlay.requestFullscreen();
                } else if (overlay.webkitRequestFullscreen) {
                    overlay.webkitRequestFullscreen();
                } else if (overlay.msRequestFullscreen) {
                    overlay.msRequestFullscreen();
                } else {
                    console.warn("Fullscreen API not supported — showing modal only.");
                }
            });
        }

        function closeFullscreen() {
            const overlay = document.getElementById('fullscreenOverlay');
            const video = document.getElementById('fullscreenVideo');
            const iframe = document.getElementById('youtubeFrame');

            // Stop and reset media
            video.pause();
            video.currentTime = 0;
            video.src = '';
            iframe.src = '';

            // Hide players
            video.style.display = 'none';
            iframe.style.display = 'none';

            // Hide overlay
            overlay.style.display = 'none';

            // Exit fullscreen if active
            if (document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement) {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        // Close when clicking overlay background
        document.getElementById('fullscreenOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeFullscreen();
            }
        });

        // Close on Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeFullscreen();
            }
        });
    </script>
</body>
</html>
