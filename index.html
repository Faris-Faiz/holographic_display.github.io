<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holographic Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: white;
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            width: 95vw;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2vw;
        }

        h1 {
            text-align: center;
            margin-bottom: 4vh;
            color: #333;
            font-size: clamp(2rem, 4vw, 4rem);
            font-weight: bold;
            text-shadow: none;
        }

        h2 {
            text-align: center;
            margin-bottom: 6vh;
            color: #7B9BB8;
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            font-weight: 300;
            letter-spacing: 2px;
        }

        /* Loading Screen Styles */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            color: #333;
        }

        .loading-title {
            font-size: clamp(2rem, 4vw, 4rem);
            margin-bottom: 4vh;
            text-shadow: none;
        }

        .loading-progress {
            width: 60vw;
            max-width: 600px;
            height: 12px;
            background: #e0e0e0;
            border-radius: 25px;
            overflow: hidden;
            margin-bottom: 2vh;
        }

        .loading-bar {
            height: 100%;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 25px;
        }

        .loading-text {
            font-size: clamp(1rem, 2vw, 1.5rem);
            opacity: 0.8;
        }

        /* Step Screens */
        .step-screen {
            display: none;
            text-align: center;
        }

        .step-screen.active {
            display: block;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Option Selection Grid */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 4vh;
            max-width: 600px;
            margin: 0 auto;
        }

        .option-box {
            background: linear-gradient(white, white) padding-box,
                        linear-gradient(135deg, #FFE066, #4ECDC4, #E06B9F) border-box;
            border: 3px solid transparent;
            border-radius: 25px;
            padding: 3vh 4vw;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            min-height: 10vh;
            display: flex;
            align-items: center;
            color: #333;
            position: relative;
        }

        .option-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .option-icon {
            font-size: 2.5rem;
            margin-right: 2vw;
            flex-shrink: 0;
        }

        .option-text {
            flex: 1;
        }

        .option-title {
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            font-weight: 600;
            color: #333;
            margin: 0;
        }

        /* Character Selection Grid */
        .character-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6vw;
            max-width: 800px;
            margin: 0 auto;
        }

        .character-box {
            background: linear-gradient(white, white) padding-box,
                        linear-gradient(135deg, #4ECDC4, #E06B9F) border-box;
            border: 3px solid transparent;
            border-radius: 30px;
            padding: 4vh 3vw;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            min-height: 50vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            color: #333;
        }

        .character-box:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .character-image {
            width: 70%;
            max-width: 200px;
            height: auto;
            border-radius: 15px;
            margin-bottom: 3vh;
            object-fit: cover;
            transition: transform 0.3s ease;
            /* Placeholder styling when no image */
            background: #f0f0f0;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .character-box:hover .character-image {
            transform: scale(1.05);
        }

        .character-name {
            font-size: clamp(1.5rem, 3vw, 2rem);
            font-weight: bold;
            color: #333;
            letter-spacing: 1px;
        }

        .selected-option-display {
            font-size: clamp(1rem, 1.8vw, 1.5rem);
            opacity: 0.8;
            background: #f8f8f8;
            border: 2px solid #ddd;
            padding: 2vh 3vw;
            border-radius: 15px;
            margin-bottom: 4vh;
            color: #666;
            font-weight: 500;
        }

        /* Back Button */
        .back-button {
            position: absolute;
            top: 3vh;
            left: 3vw;
            background: white;
            border: 2px solid #ddd;
            color: #666;
            padding: 1.5vh 3vw;
            border-radius: 15px;
            cursor: pointer;
            font-size: clamp(0.9rem, 1.5vw, 1.2rem);
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .back-button:hover {
            background: #f8f8f8;
            border-color: #bbb;
            transform: translateY(-2px);
        }

        /* Video Player */
        .fullscreen-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 9999;
            display: none;
        }

        .fullscreen-video video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Loading spinner for individual items */
        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #4ECDC4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }

        .character-box.loading .loading-spinner {
            display: block;
        }

        .character-box.loading .character-image {
            opacity: 0.3;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .character-grid {
                grid-template-columns: 1fr;
                gap: 4vh;
            }
            
            .options-grid {
                gap: 3vh;
            }
            
            .option-box {
                padding: 2.5vh 4vw;
                flex-direction: column;
                text-align: center;
            }
            
            .option-icon {
                margin-right: 0;
                margin-bottom: 1vh;
            }
        }

        @media (min-width: 1920px) {
            .container {
                padding: 3vw;
            }
            
            .options-grid {
                max-width: 800px;
                gap: 5vh;
            }
            
            .character-grid {
                max-width: 1000px;
                gap: 8vw;
            }
            
            .option-box {
                min-height: 12vh;
                padding: 4vh 5vw;
            }
            
            .character-box {
                min-height: 55vh;
                padding: 5vh 4vw;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-title">Holographic Display</div>
        <div class="loading-progress">
            <div class="loading-bar" id="loadingBar"></div>
        </div>
        <div class="loading-text" id="loadingText">Loading content...</div>
    </div>

    <div class="container">
        <!-- Step 1: Option Selection -->
        <div class="step-screen" id="optionSelection">
            <h1>SELECT AN OPTION</h1>
            <!-- <h2>SELECT AN OPTION</h2> -->
            
            <div class="options-grid">
                <div class="option-box" onclick="selectOption('joke')">
                    <!-- <div class="option-icon">😊</div> -->
                    <div class="option-text">
                        <div class="option-title">TELL ME A JOKE</div>
                    </div>
                </div>
                
                <div class="option-box" onclick="selectOption('slang')">
                    <!-- <div class="option-icon">💬</div> -->
                    <div class="option-text">
                        <div class="option-title">TEACH ME A GEN Z SLANG</div>
                    </div>
                </div>
                
                <div class="option-box" onclick="selectOption('talent')">
                    <!-- <div class="option-icon">✨</div> -->
                    <div class="option-text">
                        <div class="option-title">SHARE A HIDDEN TALENT</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Step 2: Character Selection -->
        <div class="step-screen" id="characterSelection">
            <button class="back-button" onclick="goBack()">← Back</button>
            <h1>CHOOSE YOUR CHARACTER</h1>            
            <div class="selected-option-display" id="selectedOptionDisplay"></div>
            
            <div class="character-grid">
                <div class="character-box" onclick="playVideo('adam')" id="adamBox">
                    <img class="character-image" id="adamImage" alt="Adam">
                    <div class="character-name">ADAM</div>
                    <div class="loading-spinner"></div>
                </div>
                
                <div class="character-box" onclick="playVideo('liz')" id="lizBox">
                    <img class="character-image" id="lizImage" alt="Liz">
                    <div class="character-name">LIZ</div>
                    <div class="loading-spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Fullscreen Video Player -->
    <div class="fullscreen-video" id="fullscreenPlayer">
        <video controls autoplay></video>
    </div>

    <script>
        // Global state
        let selectedOption = '';
        let blobUrlCache = new Map();
        let imageCache = new Map();
        let activeBlobs = new Set();
        let autoCloseTimer = null;
        let currentVideo = null;
        
        // Video and image mappings
        const videoMappings = {
            'joke': {
                'adam': 'https://raw.githubusercontent.com/Faris-Faiz/holographic_display.github.io/refs/heads/main/Adam%20Q1.mp4',
                'liz': 'https://raw.githubusercontent.com/Faris-Faiz/holographic_display.github.io/refs/heads/main/Liz%20Q1.mov'
            },
            'slang': {
                'adam': 'https://raw.githubusercontent.com/Faris-Faiz/holographic_display.github.io/refs/heads/main/Adam%20Q2.mp4',
                'liz': 'https://raw.githubusercontent.com/Faris-Faiz/holographic_display.github.io/refs/heads/main/Liz%20Q2.mov'
            },
            'talent': {
                'adam': 'https://raw.githubusercontent.com/Faris-Faiz/holographic_display.github.io/refs/heads/main/Adam%20Q3.mp4',
                'liz': 'https://raw.githubusercontent.com/Faris-Faiz/holographic_display.github.io/refs/heads/main/Liz%20Q3.mov'
            }
        };

        const imageMappings = {
            'joke': {
                'adam': 'https://raw.githubusercontent.com/Faris-Faiz/holographic_display.github.io/refs/heads/main/Adam%20Character%20Select.png',
                'liz': 'https://raw.githubusercontent.com/Faris-Faiz/holographic_display.github.io/refs/heads/main/Liz%20Character%20Select.png'
            },
            'slang': {
                'adam': 'https://raw.githubusercontent.com/Faris-Faiz/holographic_display.github.io/refs/heads/main/Adam%20Character%20Select.png',
                'liz': 'https://raw.githubusercontent.com/Faris-Faiz/holographic_display.github.io/refs/heads/main/Liz%20Character%20Select.png'
            },
            'talent': {
                'adam': 'https://raw.githubusercontent.com/Faris-Faiz/holographic_display.github.io/refs/heads/main/Adam%20Character%20Select.png',
                'liz': 'https://raw.githubusercontent.com/Faris-Faiz/holographic_display.github.io/refs/heads/main/Liz%20Character%20Select.png'
            }
        };

        const optionTitles = {
            'joke': 'Tell me a joke',
            'slang': 'Teach me a Gen Z slang',
            'talent': 'Share a hidden talent'
        };

        // Fetch resource as blob
        async function fetchAsBlob(url) {
            try {
                console.log('Fetching:', url);
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                activeBlobs.add(blobUrl);
                
                console.log('Successfully fetched:', url);
                return blobUrl;
            } catch (error) {
                console.error('Error fetching:', url, error);
                throw error;
            }
        }

        // Preload all resources
        async function preloadAllResources() {
            const loadingBar = document.getElementById('loadingBar');
            const loadingText = document.getElementById('loadingText');
            
            // Collect all unique URLs
            const videoUrls = new Set();
            const imageUrls = new Set();
            
            Object.values(videoMappings).forEach(characters => {
                Object.values(characters).forEach(url => videoUrls.add(url));
            });
            
            Object.values(imageMappings).forEach(characters => {
                Object.values(characters).forEach(url => imageUrls.add(url));
            });
            
            const allUrls = [...videoUrls, ...imageUrls];
            let loaded = 0;
            
            // Load resources in parallel
            const promises = allUrls.map(async (url) => {
                try {
                    const blobUrl = await fetchAsBlob(url);
                    
                    if (videoUrls.has(url)) {
                        blobUrlCache.set(url, blobUrl);
                    } else {
                        imageCache.set(url, blobUrl);
                    }
                    
                    loaded++;
                    const progress = (loaded / allUrls.length) * 100;
                    loadingBar.style.width = `${progress}%`;
                    loadingText.textContent = `Loading content... ${Math.round(progress)}%`;
                    
                } catch (error) {
                    console.error('Failed to load resource:', url, error);
                    loaded++;
                    const progress = (loaded / allUrls.length) * 100;
                    loadingBar.style.width = `${progress}%`;
                }
            });
            
            await Promise.all(promises);
            
            // Hide loading screen and show first step
            setTimeout(() => {
                document.getElementById('loadingScreen').style.display = 'none';
                showStep('optionSelection');
            }, 500);
        }

        // Show specific step
        function showStep(stepId) {
            document.querySelectorAll('.step-screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(stepId).classList.add('active');
        }

        // Select option and proceed to character selection
        function selectOption(option) {
            selectedOption = option;
            
            // Update display
            document.getElementById('selectedOptionDisplay').textContent = optionTitles[option];
            
            // Update character images
            updateCharacterImages();
            
            showStep('characterSelection');
        }

        // Update character images based on selected option
        function updateCharacterImages() {
            const adamImg = document.getElementById('adamImage');
            const lizImg = document.getElementById('lizImage');
            
            if (selectedOption && imageMappings[selectedOption]) {
                const adamImageUrl = imageCache.get(imageMappings[selectedOption]['adam']);
                const lizImageUrl = imageCache.get(imageMappings[selectedOption]['liz']);
                
                if (adamImageUrl) adamImg.src = adamImageUrl;
                if (lizImageUrl) lizImg.src = lizImageUrl;
            }
        }

        // Go back to option selection
        function goBack() {
            showStep('optionSelection');
            selectedOption = '';
        }

        // Play video
        async function playVideo(character) {
            if (!selectedOption) return;
            
            const videoUrl = videoMappings[selectedOption][character];
            if (!videoUrl) {
                alert('Video not found');
                return;
            }

            // Clear any existing timer
            if (autoCloseTimer) {
                clearTimeout(autoCloseTimer);
                autoCloseTimer = null;
            }

            const characterBox = document.getElementById(character + 'Box');
            let blobUrl = blobUrlCache.get(videoUrl);
            
            if (!blobUrl) {
                try {
                    characterBox.classList.add('loading');
                    blobUrl = await fetchAsBlob(videoUrl);
                    blobUrlCache.set(videoUrl, blobUrl);
                    characterBox.classList.remove('loading');
                } catch (error) {
                    console.error('Failed to load video:', error);
                    characterBox.classList.remove('loading');
                    alert('Failed to load video: ' + error.message);
                    return;
                }
            }

            // Show fullscreen video
            const fullscreenPlayer = document.getElementById('fullscreenPlayer');
            const video = fullscreenPlayer.querySelector('video');
            
            video.src = blobUrl;
            fullscreenPlayer.style.display = 'block';
            currentVideo = video;

            try {
                await video.play();
            } catch (error) {
                console.error('Playbook failed:', error);
                video.muted = true;
                try {
                    await video.play();
                } catch (mutedError) {
                    console.error('Muted autoplay also failed:', mutedError);
                }
            }

            // Auto-close after 10 seconds
            autoCloseTimer = setTimeout(() => {
                closeVideo();
            }, 10000);
        }

        // Close video and return to start
        function closeVideo() {
            if (autoCloseTimer) {
                clearTimeout(autoCloseTimer);
                autoCloseTimer = null;
            }

            const fullscreenPlayer = document.getElementById('fullscreenPlayer');
            const video = fullscreenPlayer.querySelector('video');
            
            video.pause();
            video.currentTime = 0;
            video.src = '';
            fullscreenPlayer.style.display = 'none';
            currentVideo = null;

            // Return to option selection
            selectedOption = '';
            showStep('optionSelection');
        }

        // Clean up blob URLs
        function cleanupBlobUrls() {
            console.log('Cleaning up blob URLs...');
            
            for (const blobUrl of activeBlobs) {
                URL.revokeObjectURL(blobUrl);
            }
            
            blobUrlCache.clear();
            imageCache.clear();
            activeBlobs.clear();
            console.log('Blob URL cleanup completed');
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', preloadAllResources);

        // Cleanup on page unload
        window.addEventListener('beforeunload', cleanupBlobUrls);
        window.addEventListener('pagehide', cleanupBlobUrls);

        // Close video on ESC or click
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && currentVideo) {
                closeVideo();
            }
        });

        document.getElementById('fullscreenPlayer').addEventListener('click', function(e) {
            if (e.target === this) {
                closeVideo();
            }
        });
    </script>
</body>
</html>
